<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>売上ダッシュボード</title>
<link rel="stylesheet" href="app/style.css"></head><body><div id="root"><div class="lg s">読み込み中…</div></div>
<script src="app/crypto.js"></script><script src="app/common.js"></script><script src="app/merge.js"></script><script src="app/templates.js"></script>
<script>
(async()=>{
const C=SalesCommon, root=document.getElementById('root'); const cfg=await C.loadConfig();
async function show(sess){
  root.innerHTML='<div class="lg s">データを復号しています…</div>';
  const man=await C.fetchJSON('data/manifest.json'); const ms=Object.keys(man.months).sort();
  const recs=await Promise.all(ms.map(async m=>SalesCrypto.decryptJSON(sess.key,await C.fetchJSON('data/m/'+m+'.enc.json?v='+encodeURIComponent(man.months[m].updated||'')))));
  const fys=SalesMerge.fiscalYears(recs); const q=new URLSearchParams(location.search);
  let fy=+(q.get('fy')||fys[0]); if(!fys.includes(fy)) fy=fys[0];
  const view=q.get('view')||(innerWidth>=900?'pc':'sp');
  const D=SalesMerge.buildFY(recs,fy,sess.names.table,true,sess.names.pinned);
  const tag='R'+(fy-2018);
  const opts=fys.map(f=>`<option value="${f}"${f===fy?' selected':''}>令和${f-2018}年度${f===fys[0]?'（最新）':''}</option>`).join('');
  const bar=`<div id="fybar" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%">
   <select id="selFY" style="flex:1;min-width:150px;min-height:44px;background:#121829;color:#e6ebf5;border:1px solid #2a3556;border-radius:10px;padding:6px 10px;font:inherit;font-size:16px">${opts}</select>
   <a href="?fy=${fy}&view=${view==='pc'?'sp':'pc'}" style="color:#8b95b0;font-size:12px;text-decoration:none;border:1px solid #2a3556;border-radius:8px;padding:10px 8px">${view==='pc'?'スマホ表示':'PC表示'}</a>
   <a href="upload.html" style="color:#8b95b0;font-size:12px;text-decoration:none;border:1px solid #2a3556;border-radius:8px;padding:10px 8px">アップロード</a>
   <a href="#" id="lo" style="color:#8b95b0;font-size:12px;text-decoration:none;border:1px solid #2a3556;border-radius:8px;padding:10px 8px">ログアウト</a></div>`;
  const chart=await (await fetch('app/chart.umd.min.js')).text();
  let html=TPL[view].split('/*TAG*/').join(tag).replace('/*CHARTJS*/',()=>chart).replace('/*DATA*/',()=>JSON.stringify(D).replace(/</g,'\\u003c')).replace('<!--FYBAR-->',()=>bar);
  html=html.replace('</body>',()=>`<script>document.getElementById('selFY').onchange=e=>{location.search='?fy='+e.target.value+'&view=${view}'};document.getElementById('lo').onclick=e=>{e.preventDefault();sessionStorage.removeItem('sd_key');localStorage.removeItem('sd_key');location.href=location.pathname};<\/script></body>`);
  document.open(); document.write(html); document.close();
}
try{ const s=await C.resume(); if(s) return await show(s); }catch(e){ console.error(e); }
C.loginForm(root,cfg,s=>show(s).catch(e=>{root.innerHTML='<div class="lg err">表示エラー: '+e.message+'</div>'}),'売上ダッシュボード');
})();
</script></body></html>
